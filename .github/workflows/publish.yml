name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install npm with OIDC support
        run: npm install --global npm@11.19.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify release tag
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must match the stable package version: v<major>.<minor>.<patch>');
          }
          JS
      - name: Validate publication without uploading
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run --access public
      - name: Publish with OIDC
        if: github.event_name == 'push'
        run: npm publish --access public
